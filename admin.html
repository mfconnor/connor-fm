<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>admin — connor.fm</title>

  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <style>
    :root {
      --background: #e8e3d4;
      --surface: #efebdf;
      --text: #171714;
      --muted: rgba(23, 23, 20, .55);
      --line: rgba(23, 23, 20, .3);
      --line-light: rgba(23, 23, 20, .15);
      --error: #8b2929;
      --success: #35633c;
      --warning: #8a6824;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    a {
      color: inherit;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
      border: 1px solid var(--text);
      background: var(--text);
      color: var(--background);
      padding: 11px 16px;
      font-size: 12px;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    button.secondary {
      background: transparent;
      color: var(--text);
    }

    button.danger {
      border-color: var(--error);
      background: transparent;
      color: var(--error);
    }

    button.small {
      padding: 6px 10px;
      font-size: 11px;
    }

    .container {
      width: min(1100px, calc(100% - 32px));
      margin: auto;
    }

    .small {
      font-size: 11px;
      color: var(--muted);
    }

    .mono {
      font-family: monospace;
    }


    /* HEADER */

    header {
      border-bottom: 1px solid var(--line);
      padding: 22px 0;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      font-size: 13px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 18px;
      font-size: 12px;
    }

    .header-actions a {
      color: var(--muted);
      text-decoration: none;
    }

    .header-actions a:hover {
      color: var(--text);
    }

    #logoutButton {
      display: none;
    }


    /* LOGIN */

    .login {
      max-width: 460px;
      padding: 70px 0 100px;
    }

    h1 {
      font-size: clamp(42px, 8vw, 76px);
      font-weight: 400;
      letter-spacing: -.06em;
      line-height: .95;
      margin: 10px 0 30px;
    }

    .login button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
    }

    .login .status {
      display: block;
      margin-top: 12px;
    }


    /* LAYOUT */

    #dashboard {
      display: none;
      grid-template-columns: 190px 1fr;
      gap: 60px;
      padding: 50px 0 0;
    }

    .tabs {
      position: sticky;
      top: 20px;
      align-self: start;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--line);
    }

    .tabs button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-bottom: 1px solid var(--line-light);
      padding: 13px 0;
      font-size: 13px;
      text-align: left;
    }

    .tabs button:hover,
    .tabs button.active {
      color: var(--text);
    }

    .tabs button .num {
      font-family: monospace;
      font-size: 10px;
      margin-right: 10px;
      opacity: .7;
    }

    .tabs button .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--warning);
      visibility: hidden;
    }

    .tabs button.dirty .dot {
      visibility: visible;
    }

    .panel {
      min-width: 0;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
    }

    .panel-head h1 {
      margin-bottom: 0;
    }

    .panel-intro {
      font-size: 13px;
      color: var(--muted);
      margin: 18px 0 40px;
      max-width: 560px;
      line-height: 1.5;
    }

    .view-link {
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      margin-bottom: 8px;
    }

    .view-link:hover {
      color: var(--text);
    }


    /* GROUPS + FIELDS */

    .group {
      border-top: 1px solid var(--line);
      padding: 28px 0 10px;
    }

    .group-head {
      margin-bottom: 22px;
    }

    h2 {
      font-size: 22px;
      font-weight: 400;
      margin: 0 0 6px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
    }

    .field {
      grid-column: 1 / -1;
      margin-bottom: 18px;
    }

    .field.half {
      grid-column: auto;
    }

    label {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin: 0 0 7px;
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.4;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: transparent;
      border: 1px solid rgba(23, 23, 20, .35);
      padding: 12px;
      color: inherit;
      outline: none;
      border-radius: 0;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--text);
    }

    input::placeholder,
    textarea::placeholder {
      color: rgba(23, 23, 20, .35);
    }

    .preview {
      display: none;
      width: 120px;
      height: 120px;
      object-fit: cover;
      border: 1px solid var(--line);
      margin-top: 10px;
    }


    /* LISTS */

    .list-items {
      margin-bottom: 14px;
    }

    .list-item {
      border: 1px solid var(--line);
      margin-bottom: 10px;
      background: var(--surface);
    }

    .list-item-head {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      cursor: pointer;
    }

    .list-item-index {
      font-family: monospace;
      font-size: 10px;
      color: var(--muted);
      width: 22px;
    }

    .list-item-title {
      flex: 1;
      min-width: 0;
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .list-item-actions {
      display: flex;
      gap: 6px;
    }

    .list-item-body {
      display: none;
      border-top: 1px solid var(--line-light);
      padding: 18px 14px 4px;
    }

    .list-item.open .list-item-body {
      display: block;
    }

    .badge {
      font-family: monospace;
      font-size: 9px;
      text-transform: uppercase;
      letter-spacing: .05em;
      border: 1px solid var(--line);
      padding: 4px 6px;
      white-space: nowrap;
    }

    .badge.live {
      border-color: var(--success);
      color: var(--success);
    }

    .badge.scheduled {
      border-color: var(--warning);
      color: var(--warning);
    }

    .badge.draft {
      color: var(--muted);
    }

    .empty {
      font-size: 12px;
      color: var(--muted);
      border: 1px dashed var(--line);
      padding: 18px 14px;
      margin-bottom: 14px;
    }


    /* FILE FIELDS */

    .file-row {
      display: flex;
      gap: 8px;
    }

    .file-row input {
      flex: 1;
      min-width: 0;
    }

    .file-row button {
      white-space: nowrap;
    }

    .file-input {
      display: none;
    }

    .progress {
      height: 2px;
      background: var(--line-light);
      margin-top: 8px;
      display: none;
    }

    .progress.visible {
      display: block;
    }

    .progress div {
      height: 100%;
      width: 0;
      background: var(--text);
      transition: width .2s ease;
    }

    .audio-preview {
      display: block;
      width: 100%;
      height: 36px;
      margin-top: 10px;
    }

    .file-row.dragging input {
      border-color: var(--text);
      border-style: dashed;
    }


    /* MEDIA LIBRARY */

    .media-summary {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 18px;
    }

    .media-item {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 14px;
      align-items: center;
      border: 1px solid var(--line);
      background: var(--surface);
      padding: 10px;
      margin-bottom: 8px;
    }

    .media-thumb {
      width: 56px;
      height: 56px;
      object-fit: cover;
      border: 1px solid var(--line-light);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: 10px;
      color: var(--muted);
    }

    .media-info {
      min-width: 0;
    }

    .media-name {
      font-size: 14px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .media-meta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .media-meta .unused {
      color: var(--warning);
    }


    /* SAVE BAR */

    .save-bar {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 16px;
      background: var(--background);
      border-top: 1px solid var(--line);
      padding: 16px 0 22px;
      margin-top: 20px;
      z-index: 2;
    }

    .status {
      font-size: 12px;
      color: var(--muted);
    }

    .status.error {
      color: var(--error);
    }

    .status.success {
      color: var(--success);
    }

    .status.warning {
      color: var(--warning);
    }

    .inline-action {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }


    /* MOBILE */

    @media (max-width: 760px) {
      #dashboard {
        grid-template-columns: 1fr;
        gap: 30px;
        padding-top: 25px;
      }

      .tabs {
        position: static;
        flex-direction: row;
        overflow-x: auto;
        border-top: 0;
        border-bottom: 1px solid var(--line);
        gap: 20px;
        scrollbar-width: none;
      }

      .tabs button {
        border-bottom: 0;
        white-space: nowrap;
        gap: 6px;
      }

      .tabs button .num {
        display: none;
      }

      .fields {
        grid-template-columns: 1fr;
      }

      .panel-head {
        flex-direction: column;
        align-items: flex-start;
      }

      .list-item-head {
        flex-wrap: wrap;
      }

      .file-row {
        flex-wrap: wrap;
      }

      .media-item {
        grid-template-columns: 56px 1fr;
      }

      .media-item .list-item-actions {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">
    <div class="brand">connor.fm / admin</div>

    <div class="header-actions">
      <a href="/" target="_blank" rel="noopener">view site ↗</a>
      <button id="logoutButton" class="secondary small" type="button">log out</button>
    </div>
  </div>
</header>

<main class="container">

  <!-- LOGIN -->

      <label for="loginPassword">password</label>

      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="enter password"

      <button type="submit">enter</button>
    </form>

    <span class="status error" id="loginError" role="alert"></span>
  </section>


  <!-- DASHBOARD -->

  <section id="dashboard">
    <nav class="tabs" id="tabs"></nav>
    <div class="panel" id="panel"></div>
  </section>

</main>

// ==========================================
// STATE
// ==========================================

let content = {};
let currentTab = null;

const dirtyTabs = new Set();
const openItems = new WeakSet();


// ==========================================
// API
// ==========================================

async function api(path, options = {}) {

  const response = await fetch(path, {
    cache: "no-store",
    ...options,
    headers: options.body ? { "Content-Type": "application/json" } : undefined
  });

  let data = {};

  try {
    data = await response.json();
  } catch {
    // Non-JSON response; handled below.
  }

  if (response.status === 401 && path !== "/api/admin/login") {
    dirtyTabs.clear();
    alert("Your session has expired. Please log in again.");
    location.reload();
    throw new Error("Unauthorized.");
  }

  if (!response.ok || data.success === false) {
    throw new Error(data.error || "Something went wrong.");
  }

  return data;
}


// ==========================================
// LOGIN / LOGOUT
// ==========================================

document.getElementById("loginForm").addEventListener("submit", async event => {

  event.preventDefault();

  const button = event.target.querySelector("button");
  const error = document.getElementById("loginError");

  error.textContent = "";
  button.disabled = true;

  try {
    await api("/api/admin/login", {
      method: "POST",
      body: JSON.stringify({ password: document.getElementById("loginPassword").value })
    });

    document.getElementById("loginPassword").value = "";

    await showDashboard();

  } catch (err) {
    error.textContent = err.message;

  } finally {
    button.disabled = false;
  }
});


document.getElementById("logoutButton").addEventListener("click", async () => {

  if (dirtyTabs.size && !confirm("You have unsaved changes. Log out anyway?")) {
    return;
  }

  dirtyTabs.clear();

  await fetch("/api/admin/logout", { method: "POST" });

  location.reload();
});


async function checkSession() {

  try {
    const data = await api("/api/admin/check");

    if (data.authenticated) {
      await showDashboard();
    }

  } catch {
    // Stay on the login screen.
  }
}


async function showDashboard() {

  content = await api("/api/admin/content");

  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "grid";
  document.getElementById("logoutButton").style.display = "inline-block";

  applyDefaults();
  renderTabs();

  const fromHash = TABS.find(tab => `#${tab.id}` === location.hash);

  openTab((fromHash || TABS[0]).id);
}


// Fills empty fields with the text the website shows by default,
// so you always edit what is actually visible.
function applyDefaults() {

  TABS.forEach(tab =>
    tab.groups.forEach(group =>
      (group.fields || []).forEach(field => {
        const value = getPath(content, field.path);

        if (field.type === "list") {
          if (!Array.isArray(value) || (value.length === 0 && field.def)) {
            setPath(content, field.path, structuredClone(field.def || []));
          }

        } else if (!value && field.def !== undefined) {
          setPath(content, field.path, field.def);
        }
      })
    )
  );
}


// ==========================================
// TABS
// ==========================================

function renderTabs() {

  const nav = document.getElementById("tabs");

  nav.replaceChildren(
    ...TABS.map((tab, index) => {
      const button = el("button", { type: "button", "data-tab": tab.id });
      const name = el("span");

      name.append(el("span", { class: "num" }, String(index + 1).padStart(2, "0")), tab.title);

      button.append(name, el("span", { class: "dot", title: "unsaved changes" }));
      button.addEventListener("click", () => openTab(tab.id));

      return button;
    })
  );

  updateTabStates();
}


function updateTabStates() {

  document.querySelectorAll("#tabs button").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === currentTab);
    button.classList.toggle("dirty", dirtyTabs.has(button.dataset.tab));
  });
}


function openTab(id) {

  currentTab = id;
  history.replaceState(null, "", `#${id}`);

  renderPanel();
  updateTabStates();
  window.scrollTo(0, 0);
}


function markDirty() {

  dirtyTabs.add(currentTab);
  updateTabStates();
  setStatus("unsaved changes", "warning");
}


// Which top-level content keys a tab edits.
function tabKeys(tab) {

  return [
    ...new Set(
      tab.groups.flatMap(group => (group.fields || []).map(field => field.path.split(".")[0]))
    )
  ];
}


// ==========================================
// PANEL
// ==========================================

function renderPanel() {

  const tab = TABS.find(item => item.id === currentTab);
  const index = TABS.indexOf(tab) + 1;

  const head = el("div", { class: "panel-head" });
  const titles = el("div");

  titles.append(
    el("div", { class: "small mono" }, `${String(index).padStart(2, "0")} / ${tab.title}`),
    el("h1", {}, tab.title)
  );

  head.append(titles);

  if (tab.view) {
    head.append(el("a", { class: "view-link", href: tab.view, target: "_blank", rel: "noopener" }, "view page ↗"));
  }

  const children = [head, el("p", { class: "panel-intro" }, tab.intro)];

  tab.groups.forEach(group => children.push(renderGroup(group)));

  if (tabKeys(tab).length) {
    const saveButton = el("button", { type: "button", id: "saveButton" }, "save changes");
    saveButton.addEventListener("click", saveCurrentTab);

    const bar = el("div", { class: "save-bar" });
    bar.append(saveButton, el("span", { class: "status", id: "saveStatus" }));

    children.push(bar);
  }

  document.getElementById("panel").replaceChildren(...children);

  if (dirtyTabs.has(currentTab)) {
    setStatus("unsaved changes", "warning");
  }
}


function renderGroup(group) {

  const section = el("section", { class: "group" });
  const head = el("div", { class: "group-head" });

  head.append(el("h2", {}, group.title));

  if (group.description) {
    head.append(el("div", { class: "small" }, group.description));
  }

  section.append(head);

  if (group.special === "listeningCode") {
    section.append(renderListeningCode());

  } else if (group.special === "password") {
    section.append(renderPasswordForm());

  } else if (group.special === "media") {
    section.append(renderMediaLibrary());

  } else {
    section.append(renderFields(group.fields, content));
  }

  return section;
}


function renderFields(fields, target, onChange) {

  const wrapper = el("div", { class: "fields" });

  fields.forEach(field => {
    wrapper.append(
      field.type === "list"
        ? renderList(field, target)
        : renderField(field, target, onChange)
    );
  });

  return wrapper;
}


let fieldCounter = 0;

function renderField(field, target, onChange) {

  if (field.type === "image" || field.type === "audio") {
    return renderFileField(field, target, onChange);
  }

  const id = `field${++fieldCounter}`;
  const wrapper = el("div", { class: field.half ? "field half" : "field" });
  const value = getPath(target, field.path) ?? "";

  let input;

  if (field.type === "long") {
    input = el("textarea", { id });
    input.value = value;

  } else if (field.type === "select") {
    input = el("select", { id });

    field.options.forEach(option => {
      input.append(el("option", { value: option.value }, option.label));
    });

    input.value = value || field.options[0].value;

  } else if (field.type === "datetime") {
    input = el("input", { id, type: "datetime-local" });
    input.value = toLocalInput(value);

  } else {
    input = el("input", { id, type: "text" });
    input.value = value;
  }

  if (field.placeholder || field.def) {
    input.placeholder = field.placeholder || field.def;
  }

  input.addEventListener("input", () => {
    setPath(target, field.path, field.type === "datetime" ? fromLocalInput(input.value) : input.value);

    if (onChange) {
      onChange();
    }

    markDirty();
  });

  wrapper.append(el("label", { for: id }, field.label), input);

  if (field.hint) {
    wrapper.append(el("div", { class: "hint" }, field.hint));
  }

  return wrapper;
}


// ==========================================
// FILE FIELDS (images + mp3)
//
// A link field with an upload button. Uploaded files
// get a /media/… link that is put into the field.
// Files can also be dropped onto the field.
// ==========================================

const MAX_UPLOAD = 25 * 1024 * 1024;

function renderFileField(field, target, onChange) {

  const id = `field${++fieldCounter}`;
  const wrapper = el("div", { class: field.half ? "field half" : "field" });
  const row = el("div", { class: "file-row" });
  const input = el("input", { id, type: "text", placeholder: "upload a file or paste a link" });
  const fileInput = el("input", { type: "file", class: "file-input", accept: field.type === "audio" ? "audio/mpeg,.mp3" : "image/*" });
  const uploadButton = el("button", { type: "button", class: "secondary" }, "upload");
  const removeButton = el("button", { type: "button", class: "danger" }, "remove");
  const progress = el("div", { class: "progress" });
  const bar = el("div");
  const status = el("div", { class: "hint" });

  const preview = field.type === "image"
    ? el("img", { class: "preview", alt: "" })
    : el("audio", { class: "audio-preview", controls: "", preload: "none" });

  progress.append(bar);

  const setValue = value => {
    input.value = value || "";
    setPath(target, field.path, value || "");
    updateFilePreview(preview, value);
    removeButton.style.display = value ? "" : "none";

    if (onChange) {
      onChange();
    }

    markDirty();
  };

  input.value = getPath(target, field.path) || "";
  updateFilePreview(preview, input.value);
  removeButton.style.display = input.value ? "" : "none";

  input.addEventListener("input", () => setValue(input.value));
  uploadButton.addEventListener("click", () => fileInput.click());
  removeButton.addEventListener("click", () => setValue(""));

  const handleFile = async file => {
    if (!file) {
      return;
    }

    uploadButton.disabled = true;
    progress.classList.add("visible");
    bar.style.width = "0";
    status.textContent = `uploading ${file.name}…`;
    status.style.color = "";

    try {
      const uploaded = await uploadFile(file, field.type, field.private, percent => {
        bar.style.width = `${percent}%`;
      });

      setValue(uploaded.url);
      status.textContent = `uploaded ${file.name} (${formatSize(uploaded.size)}). save to publish.`;

      if (field.onUpload) {
        await field.onUpload(target, file);
        renderPanel();
      }

    } catch (error) {
      status.textContent = error.message;
      status.style.color = "var(--error)";

    } finally {
      uploadButton.disabled = false;
      progress.classList.remove("visible");
      fileInput.value = "";
    }
  };

  fileInput.addEventListener("change", () => handleFile(fileInput.files[0]));

  row.addEventListener("dragover", event => {
    event.preventDefault();
    row.classList.add("dragging");
  });

  row.addEventListener("dragleave", () => row.classList.remove("dragging"));

  row.addEventListener("drop", event => {
    event.preventDefault();
    row.classList.remove("dragging");
    handleFile(event.dataTransfer.files[0]);
  });

  row.append(input, uploadButton, removeButton, fileInput);
  wrapper.append(el("label", { for: id }, field.label), row, progress, preview, status);

  if (field.hint) {
    wrapper.append(el("div", { class: "hint" }, field.hint));
  }

  return wrapper;
}


function updateFilePreview(preview, url) {

  const valid = url && /^(https?:\/\/|\/[^/])/.test(url);

  if (valid && preview.getAttribute("src") !== url) {
    preview.src = url;
  }

  if (!valid) {
    preview.removeAttribute("src");
  }

  preview.style.display = valid ? "block" : "none";
}


function uploadFile(file, kind, isPrivate, onProgress) {

  return new Promise((resolve, reject) => {

    const isMp3 = file.type === "audio/mpeg" || file.type === "audio/mp3" || /\.mp3$/i.test(file.name);
    const type = kind === "audio" ? (isMp3 ? "audio/mpeg" : file.type) : file.type;

    if (kind === "audio" && !isMp3) {
      reject(new Error("Please choose an mp3 file."));
      return;
    }

    if (kind === "image" && !/^image\/(jpeg|png|webp|gif)$/.test(type)) {
      reject(new Error("Please choose a jpg, png, webp or gif image."));
      return;
    }

    if (file.size > MAX_UPLOAD) {
      reject(new Error(`${file.name} is too big (${formatSize(file.size)}, max. 25 MB).`));
      return;
    }

    const params = new URLSearchParams({ name: file.name });

    if (isPrivate) {
      params.set("private", "1");
    }

    // XMLHttpRequest instead of fetch, because it can report upload progress.
    const request = new XMLHttpRequest();

    request.open("POST", `/api/admin/media?${params}`);
    request.setRequestHeader("Content-Type", type);

    request.upload.addEventListener("progress", event => {
      if (event.lengthComputable) {
        onProgress(Math.round((event.loaded / event.total) * 100));
      }
    });

    request.addEventListener("load", () => {
      let data = {};

      try {
        data = JSON.parse(request.responseText);
      } catch {
        // handled below
      }

      if (request.status === 401) {
        reject(new Error("Your session has expired. Please log in again."));
      } else if (request.status >= 400 || !data.success) {
        reject(new Error(data.error || "Upload failed."));
      } else {
        resolve(data.file);
      }
    });

    request.addEventListener("error", () => reject(new Error("Upload failed. Check your connection.")));

    request.send(file);
  });
}


// After uploading an mp3 to a track: use the file name as title
// (if the track has none yet) and read the length of the song.
async function fillTrackFromFile(track, file) {

  if (!track.title || track.title === "untitled") {
    track.title = file.name.replace(/\.mp3$/i, "").replace(/^\d+[\s._-]*/, "");
  }

  const duration = await readDuration(file);

  if (duration) {
    track.duration = duration;
  }
}


function readDuration(file) {

  return new Promise(resolve => {
    const audio = new Audio();
    const url = URL.createObjectURL(file);

    audio.preload = "metadata";

    audio.addEventListener("loadedmetadata", () => {
      URL.revokeObjectURL(url);

      const seconds = audio.duration;

      resolve(
        Number.isFinite(seconds)
          ? `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`
          : ""
      );
    });

    audio.addEventListener("error", () => {
      URL.revokeObjectURL(url);
      resolve("");
    });

    audio.src = url;
  });
}


function formatSize(bytes) {

  if (bytes >= 1024 * 1024) {
    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
  }

  return `${Math.max(1, Math.round(bytes / 1024))} KB`;
}


// ==========================================
// MEDIA LIBRARY
// ==========================================

function renderMediaLibrary() {

  const wrapper = el("div");
  const summary = el("div", { class: "media-summary" }, "loading files…");
  const list = el("div");

  wrapper.append(summary, list);

  const load = async () => {
    try {
      const { files } = await api("/api/admin/media");
      const used = JSON.stringify(content);
      const total = files.reduce((sum, file) => sum + (file.size || 0), 0);

      summary.textContent = `${files.length} file${files.length === 1 ? "" : "s"} · ${formatSize(total)} of about 1 GB`;

      if (!files.length) {
        list.replaceChildren(el("div", { class: "empty" }, "Nothing uploaded yet. Upload files in the archive, music or home tab."));
        return;
      }

      list.replaceChildren(
        ...files.map(file => {
          const item = el("div", { class: "media-item" });
          const isImage = String(file.type).startsWith("image/");
          const inUse = used.includes(file.url);

          const thumb = isImage
            ? el("img", { class: "media-thumb", src: file.url, alt: "", loading: "lazy" })
            : el("div", { class: "media-thumb" }, "mp3");

          const info = el("div", { class: "media-info" });
          const meta = el("div", { class: "media-meta" });

          meta.append(
            [formatSize(file.size || 0), file.private ? "private" : "public", file.uploaded ? new Date(file.uploaded).toLocaleDateString() : ""]
              .filter(Boolean)
              .join(" · ") + " · ",
            el("span", { class: inUse ? "" : "unused" }, inUse ? "in use" : "not used")
          );

          info.append(el("div", { class: "media-name" }, file.name || file.id), meta);

          const actions = el("div", { class: "list-item-actions" });
          const open = el("a", { href: file.url, target: "_blank", rel: "noopener" });
          open.append(el("button", { type: "button", class: "small secondary" }, "open"));

          const remove = el("button", { type: "button", class: "small danger" }, "delete");

          remove.addEventListener("click", async () => {
            const warning = inUse
              ? `"${file.name}" is still used on the website. Delete anyway?`
              : `Delete "${file.name}"?`;

            if (!confirm(warning)) {
              return;
            }

            remove.disabled = true;

            try {
              await api(`/api/admin/media?id=${encodeURIComponent(file.id)}`, { method: "DELETE" });
              load();
            } catch (error) {
              alert(error.message);
              remove.disabled = false;
            }
          });

          actions.append(open, remove);
          item.append(thumb, info, actions);

          return item;
        })
      );

    } catch (error) {
      summary.textContent = error.message;
    }
  };

  load();

  return wrapper;
}


// ==========================================
// LISTS (archive, messages, tracklist, facts)
// ==========================================

function renderList(field, target) {

  const wrapper = el("div", { class: "field" });
  const items = el("div", { class: "list-items" });
  const list = getPath(target, field.path);

  const rerender = () => wrapper.replaceWith(renderList(field, target));

  if (field.label) {
    wrapper.append(el("label", {}, field.label));
  }

  if (!list.length) {
    items.append(el("div", { class: "empty" }, field.empty));
  }

  list.forEach((item, index) => {
    items.append(renderListItem(field, list, item, index, rerender));
  });

  const addButton = el("button", { type: "button", class: "secondary" }, field.addLabel);

  addButton.addEventListener("click", () => {
    const item = field.newItem();

    if (field.addToTop) {
      list.unshift(item);
    } else {
      list.push(item);
    }

    openItems.add(item);
    markDirty();
    rerender();
  });

  wrapper.append(items, addButton);

  return wrapper;
}


function renderListItem(field, list, item, index, rerender) {

  const card = el("div", { class: openItems.has(item) ? "list-item open" : "list-item" });
  const head = el("div", { class: "list-item-head" });
  const title = el("div", { class: "list-item-title" });
  const badge = field.itemBadge ? el("span") : null;
  const actions = el("div", { class: "list-item-actions" });

  head.append(el("span", { class: "list-item-index" }, String(index + 1).padStart(2, "0")), title);

  if (badge) {
    head.append(badge);
  }

  const updateHead = () => {
    title.textContent = field.itemTitle(item);

    if (badge) {
      const status = field.itemBadge(item);
      badge.className = `badge ${status}`;
      badge.textContent = status;
    }
  };

  updateHead();

  const addAction = (label, className, handler) => {
    const button = el("button", { type: "button", class: `small ${className}` }, label);

    button.addEventListener("click", event => {
      event.stopPropagation();
      handler();
    });

    actions.append(button);
  };

  const move = direction => {
    const newIndex = index + direction;

    if (newIndex < 0 || newIndex >= list.length) {
      return;
    }

    [list[index], list[newIndex]] = [list[newIndex], list[index]];
    markDirty();
    rerender();
  };

  addAction("↑", "secondary", () => move(-1));
  addAction("↓", "secondary", () => move(1));
  addAction("delete", "danger", () => {
    if (confirm(`Delete "${field.itemTitle(item)}"?`)) {
      list.splice(index, 1);
      markDirty();
      rerender();
    }
  });

  head.append(actions);

  head.addEventListener("click", () => {
    const open = card.classList.toggle("open");

    if (open) {
      openItems.add(item);
    } else {
      openItems.delete(item);
    }
  });

  const body = el("div", { class: "list-item-body" });
  body.append(renderFields(field.item, item, updateHead));

  card.append(head, body);

  return card;
}


// ==========================================
// SAVING
// ==========================================

async function saveCurrentTab() {

  const tab = TABS.find(item => item.id === currentTab);
  const button = document.getElementById("saveButton");

  const problem = tab.beforeSave?.();

  if (problem) {
    setStatus(problem, "error");
    return;
  }

  const keys = tabKeys(tab);
  const body = Object.fromEntries(keys.map(key => [key, content[key]]));

  button.disabled = true;
  setStatus("saving…");

  try {
    const saved = await api("/api/admin/content", {
      method: "POST",
      body: JSON.stringify(body)
    });

    // Take over what the server actually stored — only for this tab,
    // so unsaved changes in other tabs are kept.
    keys.forEach(key => {
      content[key] = saved[key];
    });

    applyDefaults();
    dirtyTabs.delete(tab.id);

    renderPanel();
    updateTabStates();
    setStatus("saved — live on the website.", "success");

  } catch (error) {
    setStatus(`could not save: ${error.message}`, "error");

  } finally {
    const current = document.getElementById("saveButton");

    if (current) {
      current.disabled = false;
    }
  }
}


function setStatus(text, type = "") {

  const status = document.getElementById("saveStatus");

  if (status) {
    status.textContent = text;
    status.className = `status ${type}`;
  }
}


// Save with Ctrl+S / Cmd+S.
document.addEventListener("keydown", event => {

  if ((event.ctrlKey || event.metaKey) && event.key === "s" && document.getElementById("saveButton")) {
    event.preventDefault();
    saveCurrentTab();
  }
});


window.addEventListener("beforeunload", event => {

  if (dirtyTabs.size) {
    event.preventDefault();
  }
});


// ==========================================
// MESSAGES
// ==========================================

function messageStatus(message) {

  if (message.status === "draft") {
    return "draft";
  }

  if (message.status === "scheduled" && (!message.publishAt || new Date(message.publishAt) > new Date())) {
    return "scheduled";
  }

  return "live";
}


// Returns an error text, or nothing when everything is fine.
function prepareMessages() {

  for (const message of content.messages) {

    if (message.status === "scheduled" && !message.publishAt) {
      openItems.add(message);
      renderPanel();
      return `"${message.title || "untitled"}" is scheduled but has no date.`;
    }

    if (message.status === "live" && !message.publishAt) {
      message.publishAt = new Date().toISOString();
    }
  }
}


// datetime-local inputs work in local time; dates are stored as UTC.

function toLocalInput(value) {

  const date = new Date(value);

  if (!value || Number.isNaN(date.getTime())) {
    return "";
  }

  const pad = number => String(number).padStart(2, "0");

  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}


function fromLocalInput(value) {

  return value ? new Date(value).toISOString() : null;
}


// ==========================================
// LISTENING CODE
// ==========================================

function renderListeningCode() {

  const wrapper = el("div", { class: "fields" });
  const field = el("div", { class: "field" });
  const input = el("input", { id: "listeningCode", type: "text", autocomplete: "off" });
  const row = el("div", { class: "inline-action" });
  const button = el("button", { type: "button", class: "secondary" }, "save code");
  const status = el("span", { class: "status" });

  row.append(button, status);
  row.style.marginTop = "12px";

  field.append(
    el("label", { for: "listeningCode" }, "access code"),
    input,
    el("div", { class: "hint" }, "4–32 characters. Saved separately with its own button."),
    row
  );

  wrapper.append(field);

  api("/api/admin/listening-code")
    .then(data => {
      input.value = data.code || "";
    })
    .catch(error => {
      status.textContent = error.message;
      status.className = "status error";
    });

  button.addEventListener("click", async () => {
    button.disabled = true;

    try {
      await api("/api/admin/listening-code", {
        method: "POST",
        body: JSON.stringify({ code: input.value })
      });

      status.textContent = "code saved.";
      status.className = "status success";

    } catch (error) {
      status.textContent = error.message;
      status.className = "status error";

    } finally {
      button.disabled = false;
    }
  });

  return wrapper;
}


// ==========================================
// PASSWORD
// ==========================================

function renderPasswordForm() {

  const form = el("form", { class: "fields" });

  const current = el("div", { class: "field half" });
  current.append(
    el("label", { for: "currentPassword" }, "current password"),
    el("input", { id: "currentPassword", type: "password", autocomplete: "current-password", required: "" })
  );

  const next = el("div", { class: "field half" });
  next.append(
    el("label", { for: "newPassword" }, "new password"),
    el("input", { id: "newPassword", type: "password", autocomplete: "new-password", minlength: "12", required: "" }),
    el("div", { class: "hint" }, "At least 12 characters.")
  );

  const row = el("div", { class: "field inline-action" });
  const button = el("button", { type: "submit" }, "change password");
  const status = el("span", { class: "status" });

  row.append(button, status);
  form.append(current, next, row);

  form.addEventListener("submit", async event => {
    event.preventDefault();
    button.disabled = true;

    try {
      await api("/api/admin/password", {
        method: "POST",
        body: JSON.stringify({
          currentPassword: document.getElementById("currentPassword").value,
          newPassword: document.getElementById("newPassword").value
        })
      });

      status.textContent = "password changed. you will be logged out.";
      status.className = "status success";

      dirtyTabs.clear();
      setTimeout(() => location.reload(), 1500);

    } catch (error) {
      status.textContent = error.message;
      status.className = "status error";
      button.disabled = false;
    }
  });

  return form;
}


// ==========================================
// HELPERS
// ==========================================

// Creates an element. Text is always set as text, never as HTML.
function el(tag, attributes = {}, text) {

  const element = document.createElement(tag);

  Object.entries(attributes).forEach(([name, value]) => element.setAttribute(name, value));

  if (text !== undefined) {
    element.textContent = text;
  }

  return element;
}


function getPath(data, path) {

  return path.split(".").reduce((value, key) => value?.[key], data);
}


function setPath(data, path, value) {

  const keys = path.split(".");
  const last = keys.pop();

  const parent = keys.reduce((object, key) => {
    if (!object[key] || typeof object[key] !== "object") {
      object[key] = {};
    }

    return object[key];
  }, data);

  parent[last] = value;
}

checkSession();
