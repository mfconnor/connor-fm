<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>admin — connor.fm</title>

  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080808">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <style>
    /* Same colors and type as the public site (style.css). */

    :root {
      color-scheme: dark;

      --background: #080808;
      --surface: #10100f;
      --surface-light: #151512;

      --text: #e8e8e3;
      --muted: #8c8c87;
      --faint: #55554f;

      --khaki: #9a9865;

      --line: #242420;
      --line-strong: #33332d;

      --error: #c27070;
      --success: #9a9865;
      --warning: #c9a35a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
    }

    a {
      color: inherit;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    ::selection {
      background: var(--khaki);
      color: var(--background);
    }


    /* BUTTONS — like the unlock button on the music page */

    button {
      cursor: pointer;
      border: 1px solid var(--khaki);
      background: var(--khaki);
      color: var(--background);
      padding: 12px 18px;
      font-family: monospace;
      font-size: 12px;
      transition: opacity .2s ease, color .2s ease, border-color .2s ease;
    }

    button:hover {
      opacity: .8;
    }

    button:disabled {
      opacity: .4;
      cursor: wait;
    }

    button.secondary {
      background: transparent;
      border-color: var(--line-strong);
      color: var(--text);
    }

    button.secondary:hover {
      opacity: 1;
      border-color: var(--khaki);
      color: var(--khaki);
    }

    button.danger {
      background: transparent;
      border-color: var(--line-strong);
      color: var(--error);
    }

    button.danger:hover {
      opacity: 1;
      border-color: var(--error);
    }

    button.small {
      padding: 6px 10px;
      font-size: 11px;
    }

    .container {
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 32px;
    }

    .small {
      font-size: 12px;
      color: var(--muted);
      line-height: 1.5;
    }

    .mono {
      font-family: monospace;
      letter-spacing: .08em;
    }


    /* HEADER — like the site navigation */

    header {
      padding: 24px 0 20px;
    }

    .header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 10px;
    }

    .site-name {
      color: var(--text);
      text-decoration: none;
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.5px;
      transition: color .2s ease;
    }

    .site-name:hover {
      color: var(--khaki);
    }

    .brand-sub {
      color: var(--khaki);
      font-size: 14px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 24px;
      font-size: 14px;
    }

    .header-actions a {
      color: var(--muted);
      text-decoration: none;
      transition: color .2s ease;
    }

    .header-actions a:hover {
      color: var(--khaki);
    }

    #logoutButton {
      display: none;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 0 32px;
    }


    /* LOGIN */

    .login {
      max-width: 450px;
      padding: 85px 0 120px;
    }

    h1 {
      font-size: clamp(56px, 8vw, 110px);
      font-weight: 600;
      letter-spacing: -.07em;
      line-height: .85;
      margin: 40px 0 45px;
    }

    .login form {
      border-top: 1px solid var(--line);
      padding-top: 28px;
    }

    .login button {
      width: 100%;
      margin-top: 12px;
      padding: 15px;
    }

    .login .status {
      display: block;
      margin-top: 12px;
    }


    /* LAYOUT */

    #dashboard {
      display: none;
      grid-template-columns: 200px 1fr;
      gap: 70px;
      padding: 60px 0 0;
    }

    .tabs {
      position: sticky;
      top: 24px;
      align-self: start;
      display: flex;
      flex-direction: column;
      border-top: 1px solid var(--line);
    }

    .tabs button {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: transparent;
      color: var(--muted);
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 14px 0;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      text-align: left;
      transition: color .2s ease;
    }

    .tabs button:hover {
      opacity: 1;
      color: var(--khaki);
    }

    .tabs button.active {
      color: var(--khaki);
    }

    .tabs button .num {
      font-family: monospace;
      font-size: 11px;
      margin-right: 12px;
      color: var(--faint);
    }

    .tabs button .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--warning);
      visibility: hidden;
    }

    .tabs button.dirty .dot {
      visibility: visible;
    }

    .panel {
      min-width: 0;
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 20px;
    }

    .panel-head h1 {
      margin: 30px 0 0;
    }

    .panel-intro {
      font-size: 15px;
      color: var(--muted);
      margin: 28px 0 55px;
      max-width: 560px;
      line-height: 1.65;
    }

    .view-link {
      font-size: 14px;
      color: var(--muted);
      text-decoration: none;
      white-space: nowrap;
      margin-bottom: 6px;
      transition: color .2s ease;
    }

    .view-link:hover {
      color: var(--khaki);
    }


    /* GROUPS + FIELDS */

    .group {
      border-top: 1px solid var(--line);
      padding: 32px 0 14px;
    }

    .group-head {
      margin-bottom: 26px;
    }

    h2 {
      font-size: 28px;
      font-weight: 600;
      letter-spacing: -.05em;
      margin: 0 0 8px;
    }

    .fields {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 14px;
    }

    .field {
      grid-column: 1 / -1;
      margin-bottom: 22px;
    }

    .field.half {
      grid-column: auto;
    }

    label {
      display: block;
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      margin: 0 0 10px;
    }

    .hint {
      font-family: monospace;
      font-size: 11px;
      color: var(--faint);
      margin-top: 8px;
      line-height: 1.5;
    }

    input,
    textarea,
    select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--line);
      padding: 14px 15px;
      color: var(--text);
      font-size: 14px;
      outline: none;
      border-radius: 0;
      transition: border-color .2s ease;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.6;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--khaki);
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--faint);
    }

    input[type="password"] {
      font-family: monospace;
    }

    .preview {
      display: none;
      width: 140px;
      height: 140px;
      object-fit: cover;
      border: 1px solid var(--line);
      margin-top: 12px;
    }


    /* FILE FIELDS */

    .file-row {
      display: flex;
    }

    .file-row input {
      flex: 1;
      min-width: 0;
      border-right: 0;
    }

    .file-row button {
      white-space: nowrap;
    }

    .file-row button + button {
      border-left: 0;
    }

    .file-input {
      display: none;
    }

    .progress {
      height: 2px;
      background: var(--line);
      margin-top: 10px;
      display: none;
    }

    .progress.visible {
      display: block;
    }

    .progress div {
      height: 100%;
      width: 0;
      background: var(--khaki);
      transition: width .2s ease;
    }

    .audio-preview {
      display: block;
      width: 100%;
      height: 36px;
      margin-top: 12px;
    }

    .file-row.dragging input {
      border-color: var(--khaki);
      border-style: dashed;
    }


    /* LISTS */

    .list-items {
      margin-bottom: 14px;
      border-top: 1px solid var(--line);
    }

    .list-item {
      border-bottom: 1px solid var(--line);
    }

    .list-item.open {
      background: var(--surface);
    }

    .list-item-head {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 12px;
      cursor: pointer;
    }

    .list-item-index {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      width: 24px;
    }

    .list-item-title {
      flex: 1;
      min-width: 0;
      font-size: 17px;
      letter-spacing: -.02em;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      transition: color .2s ease;
    }

    .list-item-head:hover .list-item-title,
    .list-item.open .list-item-title {
      color: var(--khaki);
    }

    .list-item-actions {
      display: flex;
      gap: 6px;
    }

    .list-item-body {
      display: none;
      border-top: 1px solid var(--line);
      padding: 22px 12px 6px;
    }

    .list-item.open .list-item-body {
      display: block;
    }

    .badge {
      font-family: monospace;
      font-size: 10px;
      letter-spacing: .08em;
      border: 1px solid var(--line-strong);
      color: var(--muted);
      padding: 4px 7px;
      white-space: nowrap;
    }

    .badge.live {
      border-color: var(--khaki);
      color: var(--khaki);
    }

    .badge.scheduled {
      border-color: var(--warning);
      color: var(--warning);
    }

    .badge.draft {
      color: var(--faint);
    }

    .empty {
      font-family: monospace;
      font-size: 12px;
      color: var(--muted);
      padding: 22px 0;
      border-bottom: 1px solid var(--line);
    }


    /* MEDIA LIBRARY */

    .media-summary {
      font-family: monospace;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 22px;
    }

    #mediaList {
      border-top: 1px solid var(--line);
    }

    .media-item {
      display: grid;
      grid-template-columns: 56px 1fr auto;
      gap: 18px;
      align-items: center;
      border-bottom: 1px solid var(--line);
      padding: 14px 0;
    }

    .media-thumb {
      width: 56px;
      height: 56px;
      object-fit: cover;
      background: var(--surface);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: monospace;
      font-size: 10px;
      color: var(--khaki);
    }

    .media-info {
      min-width: 0;
    }

    .media-name {
      font-size: 15px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .media-meta {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
    }

    .media-meta .unused {
      color: var(--warning);
    }


    /* ROWS (codes, comments, questions) */

    .rows {
      border-top: 1px solid var(--line);
      margin-top: 8px;
    }

    .row-item {
      border-bottom: 1px solid var(--line);
    }

    .row-item.open:not(:has(.question-admin)) {
      background: var(--surface);
    }

    .row-head {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 12px;
      cursor: pointer;
    }

    .row-head.static {
      cursor: default;
    }

    .row-main {
      flex: 1;
      min-width: 0;
    }

    .row-title {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 17px;
      letter-spacing: -.02em;
    }

    .row-head:not(.static):hover .row-title > span:first-child {
      color: var(--khaki);
    }

    .row-text {
      font-size: 15px;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .row-meta {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      line-height: 1.6;
    }

    .code-value {
      color: var(--khaki);
    }

    .row-details {
      display: none;
      padding: 4px 12px 22px 12px;
    }

    .row-item.open .row-details {
      display: block;
    }

    .detail-label {
      font-family: monospace;
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--muted);
      margin: 34px 0 12px;
    }

    .row-details .detail-label:first-child {
      margin-top: 10px;
    }

    .log-line {
      display: grid;
      grid-template-columns: 170px 1fr;
      gap: 14px;
      font-size: 13px;
      padding: 7px 0;
      border-bottom: 1px solid var(--line);
    }

    .log-time {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .question-admin {
      padding: 20px 0 22px;
    }

    .question-admin-text {
      font-size: 20px;
      line-height: 1.35;
      letter-spacing: -.02em;
      margin: 12px 0 16px;
      overflow-wrap: anywhere;
    }

    .question-admin textarea {
      min-height: 90px;
      margin-bottom: 12px;
    }

    .checkbox {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0;
      cursor: pointer;
    }

    .checkbox input {
      width: auto;
      accent-color: var(--khaki);
    }

    .mono-input {
      font-family: monospace;
    }


    /* STATS */

    .notice {
      font-family: monospace;
      font-size: 11px;
      color: var(--warning);
      border: 1px solid var(--line-strong);
      padding: 12px 14px;
      margin-bottom: 22px;
    }

    .range-buttons {
      display: flex;
      gap: 6px;
      margin-bottom: 26px;
    }

    .range-buttons button.selected {
      border-color: var(--khaki);
      color: var(--khaki);
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .tile {
      padding: 22px 0;
    }

    .tile + .tile {
      padding-left: 22px;
      border-left: 1px solid var(--line);
    }

    .tile-value {
      font-size: clamp(32px, 4vw, 48px);
      font-weight: 600;
      letter-spacing: -.05em;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .tile-label {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
      margin-top: 10px;
    }

    .chart {
      position: relative;
      padding-top: 18px;
    }

    .chart-scale {
      position: absolute;
      top: 0;
      right: 0;
      font-family: monospace;
      font-size: 10px;
      color: var(--faint);
    }

    .chart-bars {
      position: relative;
      display: flex;
      align-items: flex-end;
      gap: 2px;
      height: 160px;
      border-bottom: 1px solid var(--line);
    }

    .chart-column {
      flex: 1;
      height: 100%;
      display: flex;
      align-items: flex-end;
      outline: none;
      cursor: default;
    }

    .chart-bar {
      width: 100%;
      background: var(--khaki);
      border-radius: 4px 4px 0 0;
      opacity: .85;
      transition: opacity .15s ease;
    }

    .chart-column.hover .chart-bar,
    .chart-column:focus-visible .chart-bar {
      opacity: 1;
      box-shadow: 0 0 0 1px var(--text);
    }

    .chart-tooltip {
      position: absolute;
      top: 0;
      transform: translate(-50%, -4px);
      background: var(--surface-light);
      border: 1px solid var(--line-strong);
      padding: 8px 10px;
      font-family: monospace;
      font-size: 11px;
      line-height: 1.5;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity .1s ease;
    }

    .chart-tooltip.visible {
      opacity: 1;
    }

    .chart-tooltip-date,
    .chart-tooltip-muted {
      color: var(--muted);
    }

    .chart-axis {
      display: flex;
      justify-content: space-between;
      font-family: monospace;
      font-size: 10px;
      color: var(--faint);
      margin-top: 8px;
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    .data-table th {
      font-family: monospace;
      font-size: 10px;
      font-weight: 400;
      color: var(--muted);
      text-align: left;
      padding: 0 0 8px;
      border-bottom: 1px solid var(--line);
    }

    .data-table td {
      padding: 10px 0;
      border-bottom: 1px solid var(--line);
    }

    .data-table .num {
      text-align: right;
      font-family: monospace;
      font-variant-numeric: tabular-nums;
      padding-left: 16px;
      white-space: nowrap;
    }


    /* SAVE BAR */

    .save-bar {
      position: sticky;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 18px;
      background: var(--background);
      border-top: 1px solid var(--line);
      padding: 18px 0 24px;
      margin-top: 24px;
      z-index: 2;
    }

    .status {
      font-family: monospace;
      font-size: 11px;
      color: var(--muted);
    }

    .status.error {
      color: var(--error);
    }

    .status.success {
      color: var(--success);
    }

    .status.warning {
      color: var(--warning);
    }

    .inline-action {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }


    /* MOBILE */

    @media (max-width: 760px) {
      .container {
        padding: 0 20px;
      }

      header {
        padding: 20px 0 18px;
      }

      .divider {
        margin: 0 20px;
      }

      .header-actions {
        gap: 16px;
        font-size: 13px;
      }

      h1 {
        font-size: 18vw;
      }

      #dashboard {
        grid-template-columns: 1fr;
        gap: 10px;
        padding-top: 20px;
      }

      .tabs {
        position: sticky;
        top: 0;
        z-index: 3;
        background: var(--background);
        flex-direction: row;
        overflow-x: auto;
        border-top: 0;
        border-bottom: 1px solid var(--line);
        gap: 22px;
        scrollbar-width: none;
      }

      .tabs::-webkit-scrollbar {
        display: none;
      }

      .tabs button {
        border-bottom: 0;
        white-space: nowrap;
        gap: 6px;
        font-size: 13px;
      }

      .tabs button .num {
        display: none;
      }

      .fields {
        grid-template-columns: 1fr;
      }

      .panel-head {
        flex-direction: column;
        align-items: flex-start;
        gap: 14px;
      }

      .panel {
        padding-top: 24px;
      }

      .panel-intro {
        margin-bottom: 40px;
      }

      .list-item-head {
        flex-wrap: wrap;
      }

      .file-row {
        flex-wrap: wrap;
      }

      .file-row input {
        flex-basis: 100%;
        border-right: 1px solid var(--line);
        border-bottom: 0;
      }

      .file-row button {
        flex: 1;
      }

      .media-item {
        grid-template-columns: 56px 1fr;
      }

      .row-head {
        flex-wrap: wrap;
      }

      .tiles {
        grid-template-columns: 1fr 1fr;
      }

      .tile:nth-child(3) {
        padding-left: 0;
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .tile:nth-child(4) {
        border-top: 1px solid var(--line);
      }

      .log-line {
        grid-template-columns: 1fr;
        gap: 2px;
      }

      .media-item .list-item-actions {
        grid-column: 1 / -1;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">
    <div class="brand">
      <a href="/" class="site-name">connor.fm</a>
      <span class="brand-sub">admin</span>
    </div>

    <div class="header-actions">
      <a href="/" target="_blank" rel="noopener">view site ↗</a>
      <button id="logoutButton" class="secondary small" type="button">log out</button>
    </div>
  </div>
</header>

<div class="divider"></div>

<main class="container">

  <!-- LOGIN -->

  <section id="login" class="login">
    <div class="small mono">00 / authentication</div>

    <h1>admin</h1>

    <form id="loginForm">
      <label for="loginPassword">password</label>

      <input
        id="loginPassword"
        type="password"
        autocomplete="current-password"
        placeholder="enter password"
        required
      >

      <button type="submit">enter</button>
    </form>

    <span class="status error" id="loginError" role="alert"></span>
  </section>


  <!-- DASHBOARD -->

  <section id="dashboard">
    <nav class="tabs" id="tabs"></nav>
    <div class="panel" id="panel"></div>
  </section>

</main>


<script>

// ==========================================
// WHAT CAN BE EDITED
//
// Every tab describes its fields. "path" is where the
// value lives in the content (e.g. "home.title"), "def"
// is the text the website shows when nothing is saved.
//
// Field types: text (default), long, image, select,
// datetime and list.
// ==========================================

let content = {};
let currentTab = null;

const dirtyTabs = new Set();
const openItems = new WeakSet();


// ==========================================
// API
// ==========================================

async function api(path, options = {}) {

  const response = await fetch(path, {
    cache: "no-store",
    ...options,
    headers: options.body ? { "Content-Type": "application/json" } : undefined
  });

  let data = {};

  try {
    data = await response.json();
  } catch {
    // Non-JSON response; handled below.
  }

  if (response.status === 401 && path !== "/api/admin/login") {
    dirtyTabs.clear();
    alert("Your session has expired. Please log in again.");
    location.reload();
    throw new Error("Unauthorized.");
  }

  if (!response.ok || data.success === false) {
    throw new Error(data.error || "Something went wrong.");
  }

  return data;
}


// ==========================================
// LOGIN / LOGOUT
// ==========================================

document.getElementById("loginForm").addEventListener("submit", async event => {

  event.preventDefault();

  const button = event.target.querySelector("button");
  const error = document.getElementById("loginError");

  error.textContent = "";
  button.disabled = true;

  try {
    await api("/api/admin/login", {
      method: "POST",
      body: JSON.stringify({ password: document.getElementById("loginPassword").value })
    });

    document.getElementById("loginPassword").value = "";

    await showDashboard();

  } catch (err) {
    error.textContent = err.message;

  } finally {
    button.disabled = false;
  }
});


document.getElementById("logoutButton").addEventListener("click", async () => {

  if (dirtyTabs.size && !confirm("You have unsaved changes. Log out anyway?")) {
    return;
  }

  dirtyTabs.clear();

  await fetch("/api/admin/logout", { method: "POST" });

  location.reload();
});


async function checkSession() {

  try {
    const data = await api("/api/admin/check");

    if (data.authenticated) {
      await showDashboard();
    }

  } catch {
    // Stay on the login screen.
  }
}


async function showDashboard() {

  content = await api("/api/admin/content");

  document.getElementById("login").style.display = "none";
  document.getElementById("dashboard").style.display = "grid";
  document.getElementById("logoutButton").style.display = "inline-block";

  applyDefaults();
  renderTabs();

  const fromHash = TABS.find(tab => `#${tab.id}` === location.hash);

  openTab((fromHash || TABS[0]).id);
}


// Fills empty fields with the text the website shows by default,
// so you always edit what is actually visible.
function applyDefaults() {

  TABS.forEach(tab =>
    tab.groups.forEach(group =>
      (group.fields || []).forEach(field => {
        const value = getPath(content, field.path);

        if (field.type === "list") {
          if (!Array.isArray(value) || (value.length === 0 && field.def)) {
            setPath(content, field.path, structuredClone(field.def || []));
          }

        } else if (!value && field.def !== undefined) {
          setPath(content, field.path, field.def);
        }
      })
    )
  );
}


// ==========================================
// TABS
// ==========================================

function renderTabs() {

  const nav = document.getElementById("tabs");

  nav.replaceChildren(
    ...TABS.map((tab, index) => {
      const button = el("button", { type: "button", "data-tab": tab.id });
      const name = el("span");

      name.append(el("span", { class: "num" }, String(index + 1).padStart(2, "0")), tab.title);

      button.append(name, el("span", { class: "dot", title: "unsaved changes" }));
      button.addEventListener("click", () => openTab(tab.id));

      return button;
    })
  );

  updateTabStates();
}


function updateTabStates() {

  document.querySelectorAll("#tabs button").forEach(button => {
    button.classList.toggle("active", button.dataset.tab === currentTab);
    button.classList.toggle("dirty", dirtyTabs.has(button.dataset.tab));
  });
}


function openTab(id) {

  currentTab = id;
  history.replaceState(null, "", `#${id}`);

  renderPanel();
  updateTabStates();
  window.scrollTo(0, 0);
}


function markDirty() {

  dirtyTabs.add(currentTab);
  updateTabStates();
  setStatus("unsaved changes", "warning");
}


// Which top-level content keys a tab edits.
function tabKeys(tab) {

  return [
    ...new Set(
      tab.groups.flatMap(group => (group.fields || []).map(field => field.path.split(".")[0]))
    )
  ];
}


// ==========================================
// PANEL
// ==========================================

function renderPanel() {

  const tab = TABS.find(item => item.id === currentTab);
  const index = TABS.indexOf(tab) + 1;

  const head = el("div", { class: "panel-head" });
  const titles = el("div");

  titles.append(
    el("div", { class: "small mono" }, `${String(index).padStart(2, "0")} / ${tab.title}`),
    el("h1", {}, tab.title)
  );

  head.append(titles);

  if (tab.view) {
    head.append(el("a", { class: "view-link", href: tab.view, target: "_blank", rel: "noopener" }, "view page ↗"));
  }

  const children = [head, el("p", { class: "panel-intro" }, tab.intro)];

  tab.groups.forEach(group => children.push(renderGroup(group)));

  if (tabKeys(tab).length) {
    const saveButton = el("button", { type: "button", id: "saveButton" }, "save changes");
    saveButton.addEventListener("click", saveCurrentTab);

    const bar = el("div", { class: "save-bar" });
    bar.append(saveButton, el("span", { class: "status", id: "saveStatus" }));

    children.push(bar);
  }

  document.getElementById("panel").replaceChildren(...children);

  if (dirtyTabs.has(currentTab)) {
    setStatus("unsaved changes", "warning");
  }
}


function renderGroup(group) {

  const section = el("section", { class: "group" });
  const head = el("div", { class: "group-head" });

  head.append(el("h2", {}, group.title));

  if (group.description) {
    head.append(el("div", { class: "small" }, group.description));
  }

  section.append(head);

  if (group.special === "password") {
    section.append(renderPasswordForm());

  } else if (group.special === "media") {
    section.append(renderMediaLibrary());

  } else if (group.special === "codes") {
    section.append(renderCodes());

  } else if (group.special === "comments") {
    section.append(renderCommentModeration());

  } else if (group.special === "questions") {
    section.append(renderQuestions());

  } else if (group.special === "stats") {
    section.append(renderStats());

  } else {
    section.append(renderFields(group.fields, content));
  }

  return section;
}


function renderFields(fields, target, onChange) {

  const wrapper = el("div", { class: "fields" });

  fields.forEach(field => {
    wrapper.append(
      field.type === "list"
        ? renderList(field, target)
        : renderField(field, target, onChange)
    );
  });

  return wrapper;
}


let fieldCounter = 0;

function renderField(field, target, onChange) {

  if (field.type === "image" || field.type === "audio") {
    return renderFileField(field, target, onChange);
  }

  const id = `field${++fieldCounter}`;
  const wrapper = el("div", { class: field.half ? "field half" : "field" });
  const value = getPath(target, field.path) ?? "";

  let input;

  if (field.type === "long") {
    input = el("textarea", { id });
    input.value = value;

  } else if (field.type === "select") {
    input = el("select", { id });

    field.options.forEach(option => {
      input.append(el("option", { value: option.value }, option.label));
    });

    input.value = value || field.options[0].value;

  } else if (field.type === "datetime") {
    input = el("input", { id, type: "datetime-local" });
    input.value = toLocalInput(value);

  } else {
    input = el("input", { id, type: "text" });
    input.value = value;
  }

  if (field.placeholder || field.def) {
    input.placeholder = field.placeholder || field.def;
  }

  input.addEventListener("input", () => {
    setPath(target, field.path, field.type === "datetime" ? fromLocalInput(input.value) : input.value);

    if (onChange) {
      onChange();
    }

    markDirty();
  });

  wrapper.append(el("label", { for: id }, field.label), input);

  if (field.hint) {
    wrapper.append(el("div", { class: "hint" }, field.hint));
  }

  return wrapper;
}


// ==========================================
// FILE FIELDS (images + mp3)
//
// A link field with an upload button. Uploaded files
// get a /media/… link that is put into the field.
// Files can also be dropped onto the field.
// ==========================================

const MAX_UPLOAD = 25 * 1024 * 1024;

function renderFileField(field, target, onChange) {

  const id = `field${++fieldCounter}`;
  const wrapper = el("div", { class: field.half ? "field half" : "field" });
  const row = el("div", { class: "file-row" });
  const input = el("input", { id, type: "text", placeholder: "upload a file or paste a link" });
  const fileInput = el("input", { type: "file", class: "file-input", accept: field.type === "audio" ? "audio/mpeg,.mp3" : "image/*" });
  const uploadButton = el("button", { type: "button", class: "secondary" }, "upload");
  const removeButton = el("button", { type: "button", class: "danger" }, "remove");
  const progress = el("div", { class: "progress" });
  const bar = el("div");
  const status = el("div", { class: "hint" });

  const preview = field.type === "image"
    ? el("img", { class: "preview", alt: "" })
    : el("audio", { class: "audio-preview", controls: "", preload: "none" });

  progress.append(bar);

  const setValue = value => {
    input.value = value || "";
    setPath(target, field.path, value || "");
    updateFilePreview(preview, value);
    removeButton.style.display = value ? "" : "none";

    if (onChange) {
      onChange();
    }

    markDirty();
  };

  input.value = getPath(target, field.path) || "";
  updateFilePreview(preview, input.value);
  removeButton.style.display = input.value ? "" : "none";

  input.addEventListener("input", () => setValue(input.value));
  uploadButton.addEventListener("click", () => fileInput.click());
  removeButton.addEventListener("click", () => setValue(""));

  const handleFile = async file => {
    if (!file) {
      return;
    }

    uploadButton.disabled = true;
    progress.classList.add("visible");
    bar.style.width = "0";
    status.textContent = `uploading ${file.name}…`;
    status.style.color = "";

    try {
      const uploaded = await uploadFile(file, field.type, field.private, percent => {
        bar.style.width = `${percent}%`;
      });

      setValue(uploaded.url);
      status.textContent = `uploaded ${file.name} (${formatSize(uploaded.size)}). save to publish.`;

      if (field.onUpload) {
        await field.onUpload(target, file);
        renderPanel();
      }

    } catch (error) {
      status.textContent = error.message;
      status.style.color = "var(--error)";

    } finally {
      uploadButton.disabled = false;
      progress.classList.remove("visible");
      fileInput.value = "";
    }
  };

  fileInput.addEventListener("change", () => handleFile(fileInput.files[0]));

  row.addEventListener("dragover", event => {
    event.preventDefault();
    row.classList.add("dragging");
  });

  row.addEventListener("dragleave", () => row.classList.remove("dragging"));

  row.addEventListener("drop", event => {
    event.preventDefault();
    row.classList.remove("dragging");
    handleFile(event.dataTransfer.files[0]);
  });

  row.append(input, uploadButton, removeButton, fileInput);
  wrapper.append(el("label", { for: id }, field.label), row, progress, preview, status);

  if (field.hint) {
    wrapper.append(el("div", { class: "hint" }, field.hint));
  }

  return wrapper;
}


function updateFilePreview(preview, url) {

  const valid = url && /^(https?:\/\/|\/[^/])/.test(url);

  if (valid && preview.getAttribute("src") !== url) {
    preview.src = url;
  }

  if (!valid) {
    preview.removeAttribute("src");
  }

  preview.style.display = valid ? "block" : "none";
}


function uploadFile(file, kind, isPrivate, onProgress) {

  return new Promise((resolve, reject) => {

    const isMp3 = file.type === "audio/mpeg" || file.type === "audio/mp3" || /\.mp3$/i.test(file.name);
    const type = kind === "audio" ? (isMp3 ? "audio/mpeg" : file.type) : file.type;

    if (kind === "audio" && !isMp3) {
      reject(new Error("Please choose an mp3 file."));
      return;
    }

    if (kind === "image" && !/^image\/(jpeg|png|webp|gif)$/.test(type)) {
      reject(new Error("Please choose a jpg, png, webp or gif image."));
      return;
    }

    if (file.size > MAX_UPLOAD) {
      reject(new Error(`${file.name} is too big (${formatSize(file.size)}, max. 25 MB).`));
      return;
    }

    const params = new URLSearchParams({ name: file.name });

    if (isPrivate) {
      params.set("private", "1");
    }

    // XMLHttpRequest instead of fetch, because it can report upload progress.
    const request = new XMLHttpRequest();

    request.open("POST", `/api/admin/media?${params}`);
    request.setRequestHeader("Content-Type", type);

    request.upload.addEventListener("progress", event => {
      if (event.lengthComputable) {
        onProgress(Math.round((event.loaded / event.total) * 100));
      }
    });

    request.addEventListener("load", () => {
      let data = {};

      try {
        data = JSON.parse(request.responseText);
      } catch {
        // handled below
      }

      if (request.status === 401) {
        reject(new Error("Your session has expired. Please log in again."));
      } else if (request.status >= 400 || !data.success) {
        reject(new Error(data.error || "Upload failed."));
      } else {
        resolve(data.file);
      }
    });

    request.addEventListener("error", () => reject(new Error("Upload failed. Check your connection.")));

    request.send(file);
  });
}


// After uploading an mp3 to a track: use the file name as title
// (if the track has none yet) and read the length of the song.
async function fillTrackFromFile(track, file) {

  if (!track.title || track.title === "untitled") {
    track.title = file.name.replace(/\.mp3$/i, "").replace(/^\d+[\s._-]*/, "");
  }

  const duration = await readDuration(file);

  if (duration) {
    track.duration = duration;
  }
}


function readDuration(file) {

  return new Promise(resolve => {
    const audio = new Audio();
    const url = URL.createObjectURL(file);

    audio.preload = "metadata";

    audio.addEventListener("loadedmetadata", () => {
      URL.revokeObjectURL(url);

      const seconds = audio.duration;

      resolve(
        Number.isFinite(seconds)
          ? `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`
          : ""
      );
    });

    audio.addEventListener("error", () => {
      URL.revokeObjectURL(url);
      resolve("");
    });

    audio.src = url;
  });
}


function formatSize(bytes) {

  if (bytes >= 1024 * 1024) {
    return `${(bytes / 1024 / 1024).toFixed(1)} MB`;
  }

  return `${Math.max(1, Math.round(bytes / 1024))} KB`;
}

function renderMediaLibrary() {

  const wrapper = el("div");
  const summary = el("div", { class: "media-summary" }, "loading files…");
  const list = el("div", { id: "mediaList" });

  wrapper.append(summary, list);

  const load = async () => {
    try {
      const { files } = await api("/api/admin/media");
      const used = JSON.stringify(content);
      const total = files.reduce((sum, file) => sum + (file.size || 0), 0);

      summary.textContent = `${files.length} file${files.length === 1 ? "" : "s"} · ${formatSize(total)} of about 1 GB`;

      if (!files.length) {
        list.replaceChildren(el("div", { class: "empty" }, "Nothing uploaded yet. Upload files in the archive, music or home tab."));
        return;
      }

      list.replaceChildren(
        ...files.map(file => {
          const item = el("div", { class: "media-item" });
          const isImage = String(file.type).startsWith("image/");
          const inUse = used.includes(file.url);

          const thumb = isImage
            ? el("img", { class: "media-thumb", src: file.url, alt: "", loading: "lazy" })
            : el("div", { class: "media-thumb" }, "mp3");

          const info = el("div", { class: "media-info" });
          const meta = el("div", { class: "media-meta" });

          meta.append(
            [formatSize(file.size || 0), file.private ? "private" : "public", file.uploaded ? new Date(file.uploaded).toLocaleDateString() : ""]
              .filter(Boolean)
              .join(" · ") + " · ",
            el("span", { class: inUse ? "" : "unused" }, inUse ? "in use" : "not used")
          );

          info.append(el("div", { class: "media-name" }, file.name || file.id), meta);

          const actions = el("div", { class: "list-item-actions" });
          const open = el("a", { href: file.url, target: "_blank", rel: "noopener" });
          open.append(el("button", { type: "button", class: "small secondary" }, "open"));

          const remove = el("button", { type: "button", class: "small danger" }, "delete");

          remove.addEventListener("click", async () => {
            const warning = inUse
              ? `"${file.name}" is still used on the website. Delete anyway?`
              : `Delete "${file.name}"?`;

            if (!confirm(warning)) {
              return;
            }

            remove.disabled = true;

            try {
              await api(`/api/admin/media?id=${encodeURIComponent(file.id)}`, { method: "DELETE" });
              load();
            } catch (error) {
              alert(error.message);
              remove.disabled = false;
            }
          });

          actions.append(open, remove);
          item.append(thumb, info, actions);

          return item;
        })
      );

    } catch (error) {
      summary.textContent = error.message;
    }
  };

  load();

  return wrapper;
}

function renderList(field, target) {

  const wrapper = el("div", { class: "field" });
  const items = el("div", { class: "list-items" });
  const list = getPath(target, field.path);

  const rerender = () => wrapper.replaceWith(renderList(field, target));

  if (field.label) {
    wrapper.append(el("label", {}, field.label));
  }

  if (!list.length) {
    items.append(el("div", { class: "empty" }, field.empty));
  }

  list.forEach((item, index) => {
    items.append(renderListItem(field, list, item, index, rerender));
  });

  const addButton = el("button", { type: "button", class: "secondary" }, field.addLabel);

  addButton.addEventListener("click", () => {
    const item = field.newItem();

    if (field.addToTop) {
      list.unshift(item);
    } else {
      list.push(item);
    }

    openItems.add(item);
    markDirty();
    rerender();
  });

  wrapper.append(items, addButton);

  return wrapper;
}


function renderListItem(field, list, item, index, rerender) {

  const card = el("div", { class: openItems.has(item) ? "list-item open" : "list-item" });
  const head = el("div", { class: "list-item-head" });
  const title = el("div", { class: "list-item-title" });
  const badge = field.itemBadge ? el("span") : null;
  const actions = el("div", { class: "list-item-actions" });

  head.append(el("span", { class: "list-item-index" }, String(index + 1).padStart(2, "0")), title);

  if (badge) {
    head.append(badge);
  }

  const updateHead = () => {
    title.textContent = field.itemTitle(item);

    if (badge) {
      const status = field.itemBadge(item);
      badge.className = `badge ${status}`;
      badge.textContent = status;
    }
  };

  updateHead();

  const addAction = (label, className, handler) => {
    const button = el("button", { type: "button", class: `small ${className}` }, label);

    button.addEventListener("click", event => {
      event.stopPropagation();
      handler();
    });

    actions.append(button);
  };

  const move = direction => {
    const newIndex = index + direction;

    if (newIndex < 0 || newIndex >= list.length) {
      return;
    }

    [list[index], list[newIndex]] = [list[newIndex], list[index]];
    markDirty();
    rerender();
  };

  addAction("↑", "secondary", () => move(-1));
  addAction("↓", "secondary", () => move(1));
  addAction("delete", "danger", () => {
    if (confirm(`Delete "${field.itemTitle(item)}"?`)) {
      list.splice(index, 1);
      markDirty();
      rerender();
    }
  });

  head.append(actions);

  head.addEventListener("click", () => {
    const open = card.classList.toggle("open");

    if (open) {
      openItems.add(item);
    } else {
      openItems.delete(item);
    }
  });

  const body = el("div", { class: "list-item-body" });
  body.append(renderFields(field.item, item, updateHead));

  card.append(head, body);

  return card;
}

// ==========================================

async function saveCurrentTab() {

  const tab = TABS.find(item => item.id === currentTab);
  const button = document.getElementById("saveButton");

  const problem = tab.beforeSave?.();

  if (problem) {
    setStatus(problem, "error");
    return;
  }

  const keys = tabKeys(tab);
  const body = Object.fromEntries(keys.map(key => [key, content[key]]));

  button.disabled = true;
  setStatus("saving…");

  try {
    const saved = await api("/api/admin/content", {
      method: "POST",
      body: JSON.stringify(body)
    });

    // Take over what the server actually stored — only for this tab,
    // so unsaved changes in other tabs are kept.
    keys.forEach(key => {
      content[key] = saved[key];
    });

    applyDefaults();
    dirtyTabs.delete(tab.id);

    renderPanel();
    updateTabStates();
    setStatus("saved — live on the website.", "success");

  } catch (error) {
    setStatus(`could not save: ${error.message}`, "error");

  } finally {
    const current = document.getElementById("saveButton");

    if (current) {
      current.disabled = false;
    }
  }
}


function setStatus(text, type = "") {

  const status = document.getElementById("saveStatus");

  if (status) {
    status.textContent = text;
    status.className = `status ${type}`;
  }
}


// Save with Ctrl+S / Cmd+S.
document.addEventListener("keydown", event => {

  if ((event.ctrlKey || event.metaKey) && event.key === "s" && document.getElementById("saveButton")) {
    event.preventDefault();
    saveCurrentTab();
  }
});


window.addEventListener("beforeunload", event => {

  if (dirtyTabs.size) {
    event.preventDefault();
  }
});

function messageStatus(message) {

  if (message.status === "draft") {
    return "draft";
  }

  if (message.status === "scheduled" && (!message.publishAt || new Date(message.publishAt) > new Date())) {
    return "scheduled";
  }

  return "live";
}


// Returns an error text, or nothing when everything is fine.
function prepareMessages() {

  for (const message of content.messages) {

    if (message.status === "scheduled" && !message.publishAt) {
      openItems.add(message);
      renderPanel();
      return `"${message.title || "untitled"}" is scheduled but has no date.`;
    }

    if (message.status === "live" && !message.publishAt) {
      message.publishAt = new Date().toISOString();
    }
  }
}


// datetime-local inputs work in local time; dates are stored as UTC.

function toLocalInput(value) {

  const date = new Date(value);

  if (!value || Number.isNaN(date.getTime())) {
    return "";
  }

  const pad = number => String(number).padStart(2, "0");

  return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`;
}


function fromLocalInput(value) {

  return value ? new Date(value).toISOString() : null;
}

function renderCodes() {

  const wrapper = el("div");

  // --- create ---
  const form = el("form", { class: "fields" });
  const labelField = el("div", { class: "field half" });
  const codeField = el("div", { class: "field half" });
  const labelInput = el("input", { id: "newCodeLabel", type: "text", placeholder: "e.g. max, press, studio", maxlength: "60", required: "" });
  const codeInput = el("input", { id: "newCodeValue", type: "text", placeholder: "leave empty for a random code", maxlength: "32", autocomplete: "off", class: "mono-input" });

  labelField.append(el("label", { for: "newCodeLabel" }, "who is it for?"), labelInput);
  codeField.append(el("label", { for: "newCodeValue" }, "code (optional)"), codeInput);

  const row = el("div", { class: "field inline-action" });
  const createButton = el("button", { type: "submit" }, "create code");
  const status = el("span", { class: "status" });
  row.append(createButton, status);

  form.append(labelField, codeField, row);

  const list = el("div", { class: "rows" });

  wrapper.append(form, list);

  const show = codes => {
    if (!codes.length) {
      list.replaceChildren(el("div", { class: "empty" }, "No codes yet. Create one for every person who should hear the project."));
      return;
    }

    list.replaceChildren(...codes.map(code => renderCode(code, show)));
  };

  form.addEventListener("submit", async event => {

    createButton.disabled = true;

        method: "POST",
        body: JSON.stringify({ label: labelInput.value, code: codeInput.value })
      });

      codeInput.value = "";

    .then(data => show(data.codes))
    .catch(error => list.replaceChildren(el("div", { class: "empty" }, error.message)));

function renderCode(code, show) {

  const item = el("div", { class: "row-item" });
  const head = el("div", { class: "row-head" });
  const main = el("div", { class: "row-main" });
  const title = el("div", { class: "row-title" });
  const meta = el("div", { class: "row-meta" });
  const actions = el("div", { class: "list-item-actions" });
  const details = el("div", { class: "row-details" });

  title.append(
    el("span", {}, code.label),
    el("span", { class: `badge ${code.active ? "live" : "draft"}` }, code.active ? "active" : "paused")
  );

  meta.append(
    el("span", { class: "code-value" }, code.code),
    ` · ${code.unlocks} unlock${code.unlocks === 1 ? "" : "s"} · ${code.plays} play${code.plays === 1 ? "" : "s"} · ${code.completes} completed · ${code.last_seen ? `last seen ${timeAgo(code.last_seen)}` : "never used"}`
  );

  main.append(title, meta);

  const action = (label, className, handler) => {
    const button = el("button", { type: "button", class: `small ${className}` }, label);

    button.addEventListener("click", async event => {
      event.stopPropagation();
      button.disabled = true;

      try {
        await handler(button);
      } catch (error) {
        alert(error.message);
      } finally {
        button.disabled = false;
      }
    });

    actions.append(button);
  };

  action("copy link", "secondary", async button => {
    await navigator.clipboard.writeText(`${location.origin}/music?code=${encodeURIComponent(code.code)}`);
    button.textContent = "copied";
    setTimeout(() => (button.textContent = "copy link"), 1500);
  });

  action(code.active ? "pause" : "activate", "secondary", async () => {
    const data = await api("/api/admin/codes", {
      method: "PATCH",
      body: JSON.stringify({ id: code.id, active: !code.active })
    });

    show(data.codes);
  });

  action("delete", "danger", async () => {
    if (!confirm(`Delete the code for "${code.label}"? They lose access immediately.`)) {
      return;
    }

    await api(`/api/admin/codes?id=${encodeURIComponent(code.id)}`, { method: "DELETE" });

    const data = await api("/api/admin/codes");
    show(data.codes);
  });

  head.append(main, actions);
  item.append(head, details);

  // Click to see what this person listened to.
  head.addEventListener("click", async () => {
    const open = item.classList.toggle("open");

    if (!open || details.dataset.loaded) {
      return;
    }

    details.replaceChildren(el("div", { class: "small" }, "loading…"));

    try {
      const activity = await api(`/api/admin/codes/activity?id=${encodeURIComponent(code.id)}`);
      details.dataset.loaded = "1";
      details.replaceChildren(renderActivity(activity));
    } catch (error) {
      details.replaceChildren(el("div", { class: "small" }, error.message));
    }
  });

  return item;
}


function renderActivity({ tracks, recent }) {

  const wrapper = el("div");

  if (!tracks.length && !recent.length) {

  return wrapper;
}

function renderQuestion(question, reload) {

  const item = el("div", { class: "row-item open" });
  const body = el("div", { class: "question-admin" });
  const meta = el("div", { class: "row-meta" });

  const state = !question.answer ? "new" : question.published ? "published" : "answered";

  meta.append(
    el("span", { class: `badge ${state === "published" ? "live" : state === "new" ? "scheduled" : "draft"}` }, state),
    ` ${formatDateTime(question.ts)}`
  );

  const id = `answer-${question.id}`;
  const answer = el("textarea", { id, placeholder: "your answer" });
  answer.value = question.answer || "";

  const publish = el("input", { type: "checkbox", id: `publish-${question.id}` });
  publish.checked = Boolean(question.published);

  const publishLabel = el("label", { for: `publish-${question.id}`, class: "checkbox" });
  publishLabel.prepend(publish);
  publishLabel.append(" show on the ask page");

  const save = el("button", { type: "button", class: "small" }, "save");
  const remove = el("button", { type: "button", class: "small danger" }, "delete");
  const status = el("span", { class: "status" });

  save.addEventListener("click", async () => {
    if (publish.checked && !answer.value.trim()) {
      status.textContent = "write an answer before publishing.";
      status.className = "status error";
      return;
    }

    save.disabled = true;

    try {
      await api("/api/admin/questions", {
        method: "PATCH",
        body: JSON.stringify({ id: question.id, answer: answer.value.trim(), published: publish.checked })
      });

      reload();

    } catch (error) {
      status.textContent = error.message;
      status.className = "status error";
      save.disabled = false;
    }
  });

  remove.addEventListener("click", async () => {
    if (!confirm("Delete this question for good?")) {
      return;
    }

    remove.disabled = true;

    try {
      await api(`/api/admin/questions?id=${encodeURIComponent(question.id)}`, { method: "DELETE" });
      reload();
    } catch (error) {
      alert(error.message);
      remove.disabled = false;
    }
  });

  const actions = el("div", { class: "inline-action" });
  actions.append(save, remove, publishLabel, status);

  body.append(meta, el("div", { class: "question-admin-text" }, question.text), answer, actions);
  item.append(body);

  return item;
}

function renderStatsOutput({ days, daily, pages, tracks, unlocks, limited }) {

  const wrapper = el("div");

  if (limited) {
    wrapper.append(el("div", { class: "notice" }, "On some days the free plan's limit for stats was reached — views after that point were not counted."));
  }

  // Fill in days without views so the chart has no gaps.
  const byDay = Object.fromEntries(daily.map(row => [row.day, row]));
  const series = [];

  for (let offset = days - 1; offset >= 0; offset--) {
    const day = new Date(Date.now() - offset * 86400000).toISOString().slice(0, 10);
    series.push({ day, views: byDay[day]?.views || 0, visitors: byDay[day]?.visitors || 0 });
  }

  const sum = key => series.reduce((total, row) => total + row[key], 0);
  const plays = tracks.reduce((total, track) => total + track.plays, 0);

  const tiles = el("div", { class: "tiles" });

  [
    ["page views", sum("views")],
    ["visitors", sum("visitors")],
    ["room unlocks · all time", unlocks],
    ["plays · all time", plays]
  ].forEach(([label, value]) => {
    const tile = el("div", { class: "tile" });
    tile.append(el("div", { class: "tile-value" }, value.toLocaleString()), el("div", { class: "tile-label" }, label));
    tiles.append(tile);
  });

  wrapper.append(tiles, el("div", { class: "detail-label" }, "page views per day"), barChart(series));

  wrapper.append(
    el("div", { class: "detail-label" }, "pages"),
    pages.length
      ? table(["page", "views"], pages.map(page => [page.path, page.views]))
      : el("div", { class: "empty" }, "No page views yet.")
  );

  wrapper.append(
    el("div", { class: "detail-label" }, "listening room · all time"),
    tracks.length
      ? table(
          ["track", "plays", "completed", "listeners"],
          tracks.map(track => [track.title || "untitled", track.plays, track.completes, track.listeners])
        )
      : el("div", { class: "empty" }, "No plays yet.")
  );

  return wrapper;
}


// Single series → one color, no legend; hover shows the exact numbers.
function barChart(series) {

  const chart = el("div", { class: "chart" });
  const bars = el("div", { class: "chart-bars" });
  const tooltip = el("div", { class: "chart-tooltip" });
  const max = Math.max(1, ...series.map(row => row.views));

  series.forEach(row => {
    const column = el("div", { class: "chart-column", tabindex: "0" });
    const bar = el("div", { class: "chart-bar" });

    bar.style.height = row.views ? `${Math.max(2, (row.views / max) * 100)}%` : "0";
    column.append(bar);

    const show = () => {
      tooltip.replaceChildren(
        el("div", { class: "chart-tooltip-date" }, formatDay(row.day)),
        el("div", {}, `${row.views} view${row.views === 1 ? "" : "s"}`),
        el("div", { class: "chart-tooltip-muted" }, `${row.visitors} visitor${row.visitors === 1 ? "" : "s"}`)
      );

      const left = column.offsetLeft + column.offsetWidth / 2;
      tooltip.style.left = `${Math.min(Math.max(left, 60), bars.offsetWidth - 60)}px`;
      tooltip.classList.add("visible");
      column.classList.add("hover");
    };

    const hide = () => {
      tooltip.classList.remove("visible");
      column.classList.remove("hover");
    };

    column.addEventListener("mouseenter", show);
    column.addEventListener("focus", show);
    column.addEventListener("mouseleave", hide);
    column.addEventListener("blur", hide);

    bars.append(column);
  });

  const axis = el("div", { class: "chart-axis" });
  axis.append(el("span", {}, formatDay(series[0].day)), el("span", {}, formatDay(series[series.length - 1].day)));

  const scale = el("div", { class: "chart-scale" }, `max ${max}`);

  chart.append(scale, bars, tooltip, axis);

  return chart;
}


function table(headers, rows) {

  const element = el("table", { class: "data-table" });
  const head = el("tr");

  headers.forEach((header, index) => head.append(el("th", { class: index ? "num" : "" }, header)));
  element.append(head);

  rows.forEach(cells => {
    const row = el("tr");
    cells.forEach((cell, index) => row.append(el("td", { class: index ? "num" : "" }, String(cell ?? ""))));
    element.append(row);
  });

  return element;
}


function timeAgo(time) {

  if (!time) {
    return "";
  }

  const seconds = Math.round((Date.now() - time) / 1000);

  if (seconds < 60) return "just now";
  if (seconds < 3600) return `${Math.floor(seconds / 60)} min ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)} h ago`;
  if (seconds < 86400 * 30) return `${Math.floor(seconds / 86400)} days ago`;

  return new Date(time).toLocaleDateString();
}


function formatDateTime(time) {

  return new Date(time).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
}


function formatDay(day) {

  return new Date(`${day}T12:00:00`).toLocaleDateString(undefined, { day: "numeric", month: "short" });
}


function formatSeconds(seconds) {

  return `${Math.floor(seconds / 60)}:${String(Math.floor(seconds % 60)).padStart(2, "0")}`;
}

function renderPasswordForm() {

  const form = el("form", { class: "fields" });

  const current = el("div", { class: "field half" });
  current.append(
    el("label", { for: "currentPassword" }, "current password"),
    el("input", { id: "currentPassword", type: "password", autocomplete: "current-password", required: "" })
  );

  const next = el("div", { class: "field half" });
  next.append(
    el("label", { for: "newPassword" }, "new password"),
    el("input", { id: "newPassword", type: "password", autocomplete: "new-password", minlength: "12", required: "" }),
    el("div", { class: "hint" }, "At least 12 characters.")
  );

  const row = el("div", { class: "field inline-action" });
  const button = el("button", { type: "submit" }, "change password");
  const status = el("span", { class: "status" });

  row.append(button, status);
  form.append(current, next, row);

  form.addEventListener("submit", async event => {
    event.preventDefault();
    button.disabled = true;

    try {
      await api("/api/admin/password", {
        method: "POST",
        body: JSON.stringify({
          currentPassword: document.getElementById("currentPassword").value,
          newPassword: document.getElementById("newPassword").value
        })
      });

      status.textContent = "password changed. you will be logged out.";
      status.className = "status success";

      dirtyTabs.clear();
      setTimeout(() => location.reload(), 1500);

    } catch (error) {
      status.textContent = error.message;
      status.className = "status error";
      button.disabled = false;
    }
  });

  return form;
}

// Creates an element. Text is always set as text, never as HTML.
function el(tag, attributes = {}, text) {

  const element = document.createElement(tag);

  Object.entries(attributes).forEach(([name, value]) => element.setAttribute(name, value));

  if (text !== undefined) {
    element.textContent = text;
  }

  return element;
}


function getPath(data, path) {

  return path.split(".").reduce((value, key) => value?.[key], data);
}


function setPath(data, path, value) {

  const keys = path.split(".");
  const last = keys.pop();

  const parent = keys.reduce((object, key) => {
    if (!object[key] || typeof object[key] !== "object") {
      object[key] = {};
    }

    return object[key];
  }, data);

  parent[last] = value;
}
