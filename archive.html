<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>archive — connor.fm</title>

  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <nav>

    <div class="nav-inner">

      <a href="/" class="site-name">
        connor.fm
      </a>

      <div class="nav-links">

        <a href="/music">
          music
        </a>

        <a href="/archive" class="active">
          archive
        </a>

        <a href="/about">
          about
        </a>

        <a href="#">
          ...
        </a>

      </div>

    </div>

  </nav>


  <div class="nav-divider"></div>


  <main>

    <section class="page">

      <div class="section-label">
        03 / archive
      </div>


      <div
        id="archive-list"
        class="archive-list"
      >

        <div class="archive-empty">
          loading archive...
        </div>

      </div>


      <div class="archive-note">

        a small archive of projects, ideas, releases and things
        that would otherwise disappear into the internet.

      </div>


      <div class="music-bottom">

        <span>
          a record of things that happened
        </span>

        <span>
          connor.fm/archive
        </span>

      </div>

    </section>

  </main>


  <footer>

    <div class="footer-divider"></div>

    <div class="footer-content">

      <div class="footer-name">
        connor.fm
      </div>

      <div class="footer-year">
        © 2026
      </div>

    </div>

  </footer>


  <script>

    async function loadArchive() {

      const archiveList =
        document.getElementById("archive-list");


      try {

        const response = await fetch(
          "/api/content",
          {
            method: "GET",
            cache: "no-store"
          }
        );


        if (!response.ok) {

          throw new Error(
            "Failed to load archive."
          );

        }


        const data =
          await response.json();


        let archive =
          data.archive;


        if (!Array.isArray(archive)) {

          archive = [];

        }


        if (archive.length === 0) {

          archiveList.innerHTML = `

            <div class="archive-empty">
              nothing here yet.
            </div>

          `;

          return;

        }


        archiveList.innerHTML = "";


        archive.forEach(entry => {

          const item =
            document.createElement("div");

          /*
            Wichtig:
            style.css erwartet .archive-item,
            nicht .archive-entry.
          */

          item.className =
            "archive-item";


          const year =
            document.createElement("span");

          year.className =
            "archive-year";

          year.textContent =
            entry.year || "";


          const title =
            document.createElement("span");

          title.className =
            "archive-title";

          title.textContent =
            entry.title || "";


          const type =
            document.createElement("span");

          type.className =
            "archive-type";

          type.textContent =
            entry.type || "";


          item.appendChild(year);

          item.appendChild(title);

          item.appendChild(type);


          archiveList.appendChild(item);

        });


      } catch (error) {

        console.error(error);


        archiveList.innerHTML = `

          <div class="archive-empty">
            archive temporarily unavailable.
          </div>

        `;

      }

    }


    loadArchive();

  </script>

</body>
</html>
