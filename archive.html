<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>archive — connor.fm</title>

  <meta name="description" content="connor.fm — a personal space for music, ideas and unfinished things by connor.">
  <meta name="theme-color" content="#080808">

  <meta property="og:title" content="archive — connor.fm">
  <meta property="og:description" content="connor.fm — a personal space for music, ideas and unfinished things by connor.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="connor.fm">

  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>

<body>

  <nav>
    <div class="nav-inner">
      <a href="/" class="site-name">connor.fm</a>

      <div class="nav-links">
        <a href="/music">music</a>
        <a href="/archive" class="active">archive</a>
        <a href="/about">about</a>
        <a href="/messages">...</a>
      </div>
    </div>
  </nav>

  <div class="nav-divider"></div>

  <main>

    <section class="page">
      <div class="section-label">03 / archive</div>

      <div class="archive-list" id="archiveList">
        <div class="archive-empty">loading archive...</div>
      </div>

      <div class="archive-note">
        a small archive of projects, ideas, releases and things
        that would otherwise disappear into the internet.
      </div>

      <div class="music-bottom">
        <span>a record of things that happened</span>
        <span>connor.fm/archive</span>
      </div>
    </section>
  </main>

  <footer>
    <div class="footer-divider"></div>

    <div class="footer-content">
      <div class="footer-name">connor.fm</div>
      <div class="footer-year">© 2026</div>
    </div>
  </footer>

  <script src="/site.js"></script>
  <script>

    const archiveList = document.getElementById("archiveList");


    loadContent()
      .then(({ archive }) => {
        if (!Array.isArray(archive) || archive.length === 0) {
          showEmpty(archiveList, "nothing here yet.");
          return;
        }

        archiveList.replaceChildren(...archive.map(renderEntry));
      })
      .catch(error => {
        console.error(error);
        showEmpty(archiveList, "archive temporarily unavailable.");
      });


    function renderEntry(entry) {
      const item = createElement(entry.link ? "a" : "div", "archive-item");

      if (entry.link) {
        item.href = entry.link;

        if (!entry.link.startsWith("/")) {
          item.target = "_blank";
          item.rel = "noopener noreferrer";
        }
      }

      item.append(
        createElement("span", "archive-year", entry.year || ""),
        createElement("span", "archive-title", entry.title || ""),
        createElement("span", "archive-type", entry.link ? `${entry.type || ""} ↗`.trim() : entry.type || "")
      );

      return item;
    }
  </script>

</body>
</html>
